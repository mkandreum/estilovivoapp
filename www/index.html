<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EstiloVivo – Sin conexión</title>
  <style>
    html,body{margin:0;height:100%;background:#0F172A;color:#F8FAFC;font-family:system-ui,-apple-system,Roboto,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-sizing:border-box}
    img{width:96px;height:96px;border-radius:24px;margin-bottom:24px}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#94A3B8;margin:0 0 24px;max-width:320px;line-height:1.5}
    button{background:#F43F5E;color:#fff;border:0;border-radius:999px;padding:14px 32px;font-size:16px;font-weight:600}
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="EstiloVivo">
    <h1>No hay conexión</h1>
    <p>Comprueba tu conexión a internet e inténtalo de nuevo.</p>
    <button onclick="location.href='https://estilovivo.xyoncloud.win'">Reintentar</button>
  </main>
</body>
</html>
